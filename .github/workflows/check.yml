name: offline-checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -v
  blender-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      BLENDER_BIN: ${{ runner.temp }}/blender/blender
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Blender runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libsm6 libxrender1 libxi6 libxxf86vm1
      - name: Download and verify Blender 4.5.3
        working-directory: ${{ runner.temp }}
        run: |
          curl --fail --location --retry 3 --output blender.tar.xz https://download.blender.org/release/Blender4.5/blender-4.5.3-linux-x64.tar.xz
          echo '975c58fcb244273838534bba771e64ad87739216b0f9b39a888531a49a72d845  blender.tar.xz' | sha256sum --check --strict
          mkdir blender
          tar -xf blender.tar.xz --strip-components=1 -C blender
          "$BLENDER_BIN" --version
      - name: Run real Blender integration without skips
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import unittest
          if not Path(os.environ['BLENDER_BIN']).is_file():
              raise SystemExit('Required Blender executable is missing')
          suite = unittest.defaultTestLoader.discover('tests/integration', top_level_dir='.')
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          raise SystemExit(0 if result.wasSuccessful() and result.testsRun and not result.skipped else 1)
          PY
